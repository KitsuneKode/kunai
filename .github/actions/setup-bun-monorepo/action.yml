name: Setup Bun monorepo
description: Bun, dependency caches, and install for Kunai workspace jobs.

# Checkout is deliberately NOT part of this action. A *local* composite action
# (`uses: ./.github/actions/...`) can only be resolved once the repository is
# already on disk, so a job whose first step is this action fails before the
# checkout inside it can ever run. Every caller must run actions/checkout first.

inputs:
  turbo-cache-prefix:
    description: Prefix for the per-job .turbo GitHub Actions cache key
    required: true
  skip-turbo-cache:
    description: Skip restoring and saving the local .turbo cache
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Restore Bun install store
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # actions/cache@v5
      id: bun-store
      with:
        path: ~/.bun/install/cache
        # v2: the v1 windows store captured a truncated oxfmt@0.59.0 link entry
        # (missing tinypool) and the loose restore-key kept re-serving it.
        key: ${{ runner.os }}-bun-store-v2-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-store-v2-

    - name: Cache Turbo local
      if: inputs.skip-turbo-cache != 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # actions/cache@v5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ inputs.turbo-cache-prefix }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ inputs.turbo-cache-prefix }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # A job that dies mid-install can still have its post-job cache save fire,
    # which writes a partially linked store (this is how the truncated oxfmt
    # link got persisted). Probe a bin that walks the store before letting
    # anything save, and rebuild cold if the probe fails.
    - name: Verify Bun install store
      id: bun-store-ok
      shell: bash
      run: |
        if ! bun x oxfmt --version >/dev/null 2>&1; then
          echo "::warning::Bun install store failed the oxfmt probe; rebuilding cold"
          rm -rf "$HOME/.bun/install/cache"
          bun install --frozen-lockfile
          bun x oxfmt --version
        fi

    - name: Save Bun install store
      if: steps.bun-store.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-store-v2-${{ hashFiles('bun.lock') }}
