name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseding a PR push is free; superseding a main push destroys the only
  # signal that commit will ever get, which is how two main runs were lost as
  # "cancelled" rather than reporting pass or fail.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}

jobs:
  # Decide which expensive release-artifact jobs are worth running for this diff.
  changes:
    name: Path filters
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
      docs: ${{ steps.filter.outputs.docs }}
      installer: ${{ steps.filter.outputs.installer }}
      installer-matrix: ${{ steps.installer-matrix.outputs.cells }}
    steps:
      - uses: actions/checkout@v5

      # scenarios.tsv is the single source of truth for which installer cells
      # exist and which gate they belong to. Deriving the matrix keeps this
      # workflow from drifting away from the registry it is supposed to enforce.
      - name: Derive PR-gate installer matrix
        id: installer-matrix
        run: |
          cells="$(bash apps/cli/test/docker/native-installer/run-local.sh \
            --list-scenarios --gate pr \
            | jq -Rsc 'split("\n") | map(select(length > 0) | split("\t") | {scenario: .[0], variant: .[1]})')"
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "PR-gate installer cells: $cells"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'apps/cli/**'
              - 'packages/**'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
            docs:
              - 'apps/docs/**'
              - 'docs/**'
              - '.docs/**'
              - 'AGENTS.md'
              - 'CLAUDE.md'
              - 'scripts/verify-doc-paths.ts'
              - 'apps/cli/src/container.ts'
              - 'apps/cli/src/domain/session/command-registry.ts'
              - 'apps/cli/src/cli-args.ts'
              - 'packages/providers/**/manifest.ts'
              - 'packages/design/**'
              - 'turbo.json'
              - 'package.json'
              - 'bun.lock'
            installer:
              - 'apps/cli/scripts/build*.ts'
              - 'apps/cli/src/services/update/**'
              - 'apps/cli/test/docker/**'
              - 'apps/cli/test/integration/compiled-binary-smoke.test.ts'
              - 'apps/cli/test/integration/install-scripts.test.ts'
              - 'apps/cli/test/integration/install-scripts-pwsh.test.ts'
              - 'apps/cli/test/integration/helpers/installer-script-harness.ts'
              - 'apps/cli/test/integration/helpers/readme-command-harness.ts'
              - 'apps/cli/test/integration/readme-commands.test.ts'
              - 'scripts/release-asset-contract.ts'
              - 'scripts/verify-github-release-assets.ts'
              - 'scripts/verify-readme-commands.ts'
              - 'apps/cli/test/integration/native-installer-docker.test.ts'
              - 'test/install/**'
              - 'install.sh'
              - 'install.ps1'
              - 'README.md'
              - 'packages/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/installer-matrix.yml'
              - '.github/actions/setup-bun-monorepo/**'

  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: fmt

      - name: Format check (affected on PR)
        if: github.event_name == 'pull_request'
        run: bunx turbo run fmt:check --affected --summarize

      - name: Format check (full on main)
        if: github.event_name == 'push'
        run: bunx turbo run fmt:check --summarize

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: lint

      - name: Lint (affected on PR)
        if: github.event_name == 'pull_request'
        run: bunx turbo run lint --affected --summarize

      - name: Lint (full on main)
        if: github.event_name == 'push'
        run: bunx turbo run lint --summarize

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: typecheck

      - name: Typecheck (affected on PR)
        if: github.event_name == 'pull_request'
        run: bunx turbo run typecheck --affected --summarize

      - name: Typecheck (full on main)
        if: github.event_name == 'push'
        run: bunx turbo run typecheck --summarize

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: test

      - name: Test (affected on PR)
        if: github.event_name == 'pull_request'
        run: bunx turbo run test --affected --summarize

      - name: Test (full on main)
        if: github.event_name == 'push'
        run: bunx turbo run test --summarize

  windows-cli:
    name: Windows CLI parity
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.installer == 'true'
    runs-on: windows-latest
    # Blocking. It was `continue-on-error: true` while the Windows suite could
    # not pass, and that is exactly how a kunai.exe which exited 0 printing
    # nothing reached main: the job that would have caught it was advisory. The
    # suite is green on Windows now, so a red result here is a real regression.
    #
    # Native mpv provisioning plus the compiled launcher check add bounded real
    # work. Individual steps retain tight limits so this outer ceiling still
    # identifies a true hang rather than masking one.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: windows-cli

      - name: Provision native mpv
        shell: pwsh
        timeout-minutes: 8
        run: |
          choco install mpvio --yes --no-progress
          $mpv = (Get-Command mpv.exe -ErrorAction Stop).Source
          & $mpv --version
          if ($LASTEXITCODE -ne 0) { throw "mpv --version exited $LASTEXITCODE" }

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Test CLI
        # Step-level bound so a wedged suite is attributed here rather than
        # surfacing as an unexplained job cancellation with no failing step.
        timeout-minutes: 8
        env:
          # Bun's 5s per-test default is too tight only here. The SQLite-backed
          # suites open a database per test, and the shared temp store registry
          # pays a synchronous full GC per teardown so Windows actually releases
          # the file handles; under full-suite load that intermittently pushes
          # one test over the line, and which test loses moves between runs.
          # The 8-minute step bound above stays the real hang detector.
          KUNAI_TEST_TIMEOUT_MS: "20000"
        run: bun run --cwd apps/cli test

      - name: Test Windows storage lifecycle
        # SQLite handles and temp-directory teardown have Windows-specific
        # locking semantics that the Linux package leg cannot exercise.
        timeout-minutes: 2
        run: bun run --cwd packages/storage test

      # The Linux legs build and smoke a binary; Windows did not, and that gap
      # shipped a kunai.exe that exited 0 printing nothing — `import.meta.main`
      # is false for the entry module inside a compiled Windows binary, so the
      # startup call never ran. Source execution cannot catch that class of bug:
      # only a compiled artifact can.
      - name: Build Windows host binary
        timeout-minutes: 10
        run: bun run build:binary:host

      - name: Run the Windows binary through the Node npm launcher
        shell: pwsh
        timeout-minutes: 3
        env:
          KUNAI_NPM_LAUNCHER_BINARY: ${{ github.workspace }}/apps/cli/dist/bin/kunai-windows-x64.exe
        run: bun run --cwd apps/cli test:file -- test/integration/npm-launcher.test.ts

  macos-cli:
    name: macOS CLI parity
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.cli == 'true' ||
      needs.changes.outputs.installer == 'true'
    # Apple Silicon deliberately, not `macos-13`/Intel. `macos-14` is the arm64
    # runner, and darwin-arm64 is the majority Mac target — an Intel-only leg
    # would green-light the binary most Mac users actually download.
    runs-on: macos-14
    # Blocking, for the same reason the Windows leg is. Before this job, macOS
    # had no CI coverage at all: `release.yml` smokes the darwin binaries, but
    # that is release time, so every macOS regression stayed invisible on main
    # until a release was already being cut.
    #
    # mpv is installed deliberately so the native IPC tests are mandatory. The
    # step limits below keep this wider job ceiling diagnostic rather than lax.
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: macos-cli

      - name: Provision native mpv
        timeout-minutes: 10
        run: |
          brew install mpv
          mpv --version

      - name: Typecheck workspaces
        run: bun run typecheck

      # macOS runs the POSIX suites that Windows skips, but against BSD
      # userland rather than GNU: `sed -i`, `date`, `readlink`, and `mktemp`
      # all take different flags there. install.sh is the macOS bootstrap too,
      # so a GNU-only flag in it is a broken install for every Mac user and
      # the Linux leg cannot see it.
      - name: Test CLI
        timeout-minutes: 8
        run: bun run --cwd apps/cli test

      - name: Test storage lifecycle
        # APFS is case-insensitive by default while ext4 is not, so path and
        # temp-directory handling can diverge from the Linux leg here.
        timeout-minutes: 3
        run: bun run --cwd packages/storage test

      # Same rationale as the Windows binary smoke: source execution cannot
      # catch entrypoint and embedding bugs that only exist once Bun has
      # compiled a single-file executable.
      - name: Build macOS host binary
        timeout-minutes: 10
        run: bun run build:binary:host

      - name: Smoke test macOS binary
        timeout-minutes: 3
        run: |
          set -euo pipefail
          bin="apps/cli/dist/bin/kunai-darwin-arm64"
          [ -x "$bin" ] || { echo "missing or non-executable $bin" >&2; exit 1; }

          version="$("$bin" --version 2>&1)"
          echo "kunai --version => '$version'"
          # The failure mode this exists to catch exits 0 and prints nothing,
          # so asserting the exit code alone is not enough.
          printf '%s' "$version" | grep -Eq '^kunai[[:space:]]+v?[0-9]' || {
            echo "--version did not print a kunai version" >&2; exit 1; }

          help="$("$bin" --help 2>&1)"
          [ -n "$help" ] || { echo "--help printed nothing" >&2; exit 1; }
          echo "macOS binary smoke ok"

  installer-lint:
    name: Installer script lint
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Lint installer scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          shellcheck install.sh
          shfmt -d install.sh

      - name: Lint PowerShell installer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          if ($issues) { $issues | Format-Table; exit 1 }

  build-cli:
    name: Build CLI + npm pack guard
    needs: [changes, typecheck]
    if: github.event_name == 'push' || needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: build

      - name: Build npm bundle and host binary
        run: bun run build

      - name: Package check (no dist/bin bloat)
        run: bun run pkg:check

  checks-docs:
    name: Docs build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: docs

      - name: Verify docs gate
        run: |
          bun run verify:doc-paths
          bun run --cwd apps/docs generate
          bun run --cwd apps/docs scripts/check-codegen-freshness.ts
          bun run --cwd apps/docs typecheck:app
          bun run --cwd apps/docs lint
          bun run --cwd apps/docs test
          bun run --cwd apps/docs build:app

  build-binaries:
    name: Build linux binaries
    needs: [changes, typecheck]
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: binaries

      - name: Build linux binaries (glibc + musl)
        run: >-
          bunx turbo run build:binaries --filter=@kitsunekode/kunai --
          --only linux-x64 --only linux-x64-musl --jobs 2

      - name: Smoke test compiled binaries
        run: bash apps/cli/scripts/verify-release-binaries.sh --partial

      - name: Assert kunai version (not Bun runtime)
        run: |
          ./apps/cli/dist/bin/kunai-linux-x64 --version | tee /tmp/kunai-version.txt
          grep -q '^kunai ' /tmp/kunai-version.txt
          ./apps/cli/dist/bin/kunai-linux-x64 --help >/dev/null

      - name: Upload linux binaries for installer job
        if: needs.changes.outputs.installer == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kunai-linux-binaries
          retention-days: 1
          path: |
            apps/cli/dist/bin/kunai-linux-x64
            apps/cli/dist/bin/kunai-linux-x64-musl
            apps/cli/dist/bin/SHA256SUMS

  installer-docker:
    name: Native installer ${{ matrix.scenario }} / ${{ matrix.variant }}
    needs: [changes, build-binaries]
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.installer-matrix) }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate scenario registry
        run: bash apps/cli/test/docker/native-installer/run-local.sh --list-scenarios >/dev/null

      - name: Download linux binaries
        uses: actions/download-artifact@v4
        with:
          name: kunai-linux-binaries
          path: apps/cli/dist/bin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache installer smoke images
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: installer-smoke-${{ runner.os }}-${{ hashFiles('apps/cli/test/docker/native-installer/Dockerfile') }}
          restore-keys: |
            installer-smoke-${{ runner.os }}-

      - name: Build glibc smoke image
        if: matrix.variant == 'glibc'
        uses: docker/build-push-action@v6
        with:
          context: apps/cli/test/docker/native-installer
          file: apps/cli/test/docker/native-installer/Dockerfile
          target: glibc
          load: true
          tags: kunai-installer-smoke:glibc
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build musl smoke image
        if: matrix.variant == 'musl'
        uses: docker/build-push-action@v6
        with:
          context: apps/cli/test/docker/native-installer
          file: apps/cli/test/docker/native-installer/Dockerfile
          target: musl
          load: true
          tags: kunai-installer-smoke:musl
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate Buildx cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache || true

      - name: Run scenario ${{ matrix.scenario }} / ${{ matrix.variant }}
        env:
          KUNAI_INSTALLER_DOCKER: "1"
        run: >-
          bash apps/cli/test/docker/native-installer/run-local.sh
          --skip-build
          --skip-image-build
          --only ${{ matrix.variant }}
          --scenario ${{ matrix.scenario }}

      - uses: ./.github/actions/setup-bun-monorepo
        if: matrix.scenario == 'full-lifecycle' && matrix.variant == 'glibc'
        with:
          turbo-cache-prefix: installer-docker-readme

      - name: README quick-start commands (fixture-assets)
        if: matrix.scenario == 'full-lifecycle' && matrix.variant == 'glibc'
        run: >-
          bun run verify:readme:commands --
          --mode fixture-assets
          --version 0.3.0
          --binary apps/cli/dist/bin/kunai-linux-x64

  installer-scenarios:
    name: Installer ownership scenarios
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: installer-scenarios
      - name: Run hermetic installer scenarios
        run: bun run test:installer:scenarios
