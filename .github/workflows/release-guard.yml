name: Release Guard

# Runs the same version ↔ changelog consistency check that release.yml runs,
# on every PR so the required check is emitted even for docs-only changes.
# Catches hand-bumps, missed changesets, and changelog drift
# *before* merge so the release workflow can stay simple and trusted.
#
# Publication is not part of this guard. Push-to-main Release only opens the
# Changesets version PR; candidate build + protected publish are
# workflow_dispatch only (see release.yml).

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "install.sh"
      - "install.ps1"
      - "packages/**"
      - ".changeset/**"
      - "CHANGELOG.md"
      - ".release/**"
      - "scripts/release-changelog.ts"
      - "scripts/generate-release-notes.ts"
      - "scripts/release-guard.ts"
      - "scripts/set-release-status.ts"
      - "scripts/sync-root-changelog.ts"

concurrency:
  group: release-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: Version ↔ changelog guard
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The guard scripts are run straight from source, and the chain already
      # reaches out of scripts/ into apps/cli/src (sync-npm-platform-versions
      # imports platform-assets). Today nothing in that chain resolves a package
      # dependency, so the job happens to work with no node_modules -- but that
      # is an invariant nobody is enforcing, and the first import that breaks it
      # turns this job red at release time, which is the worst moment to find
      # out. Installing is cheap and removes the tripwire.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run release guard
        run: bun run guard

      - name: Run release notes guard
        run: bun run release:notes:check
