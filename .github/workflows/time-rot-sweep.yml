name: Time-rot sweep

# Weekly detector for tests that secretly depend on the wall clock: the suite
# runs under a system clock shifted ~6 months forward, so a test that freezes
# an injected clock at a date literal while the code reads the real one fails
# here instead of expiring on an unrelated PR months from now.
#
# This is deliberately scheduled, not a PR job: the serial suite under the
# preload takes several minutes and its failures are informational ("this test
# owns only half its clock"), not a merge gate.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  future-clock:
    name: Future-clock unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The sweep only runs tests — it never pushes or reads private refs,
          # so the token does not need to persist into later steps.
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: time-rot
      - name: Run the suite 180 days ahead
        run: bun run --cwd apps/cli test:future
