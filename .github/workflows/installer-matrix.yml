name: Installer Docker Matrix

on:
  schedule:
    # 06:15 UTC daily — full native installer scenario × variant matrix
    - cron: "15 6 * * *"
  workflow_dispatch:

concurrency:
  group: installer-matrix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-registry:
    name: Validate scenario registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - uses: actions/checkout@v5
      - name: List and validate registry
        run: |
          bash apps/cli/test/docker/native-installer/run-local.sh --list-scenarios
          bash apps/cli/test/docker/native-installer/run-local.sh --list-scenarios --gate pr >/dev/null
          bash apps/cli/test/docker/native-installer/run-local.sh --list-scenarios --gate nightly >/dev/null

      # Nightly sweeps every registered cell, both gates. The matrix is derived
      # rather than transcribed so a scenario added to scenarios.tsv is covered
      # here without a parallel edit to this file.
      - name: Derive full installer matrix
        id: matrix
        run: |
          cells="$(bash apps/cli/test/docker/native-installer/run-local.sh --list-scenarios \
            | jq -Rsc 'split("\n") | map(select(length > 0) | split("\t") | {scenario: .[0], variant: .[1]})')"
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "Nightly installer cells: $cells"

  build-binaries:
    name: Build linux binaries
    needs: validate-registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: installer-matrix-binaries
      - name: Build linux-x64 + musl
        run: bun run --cwd apps/cli build:binaries -- --only linux-x64 --only linux-x64-musl
      - name: Assert every release companion exists
        # Names the missing path at the point it goes missing, rather than
        # letting an incomplete upload resurface as an installer failure in
        # every matrix cell. See the upload step below for why the artifact
        # action cannot enforce this itself.
        run: |
          missing=0
          for f in \
            apps/cli/dist/bin/kunai-linux-x64 \
            apps/cli/dist/bin/kunai-linux-x64.tar.gz \
            apps/cli/dist/bin/kunai-linux-x64-musl \
            apps/cli/dist/bin/kunai-linux-x64-musl.tar.gz \
            apps/cli/dist/bin/SHA256SUMS \
            apps/cli/dist/bin/SHA256SUMS.archives; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::missing or empty release companion"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v7
        with:
          name: kunai-linux-binaries-matrix
          retention-days: 1
          # Must match the list in `ci.yml`'s `native-installer` job
          # (`ci.yml:594-599`). `prepare-fixture` resolves a release *companion*
          # archive beside each binary — the .tar.gz, SHA256SUMS and
          # SHA256SUMS.archives — and dies on the first one missing, so
          # uploading the raw executables alone made every cell fail identically
          # with "release companion not found". That reads like an installer
          # regression and is really a missing upload, and it is what this
          # nightly matrix did from 2026-08-26 until it was fixed.
          #
          # `if-no-files-found: error` does NOT cover it: the check runs across
          # the combined path set, so five-of-six still uploads silently. The
          # step above is what actually enforces the set.
          if-no-files-found: error
          path: |
            apps/cli/dist/bin/kunai-linux-x64
            apps/cli/dist/bin/kunai-linux-x64.tar.gz
            apps/cli/dist/bin/kunai-linux-x64-musl
            apps/cli/dist/bin/kunai-linux-x64-musl.tar.gz
            apps/cli/dist/bin/SHA256SUMS
            apps/cli/dist/bin/SHA256SUMS.archives

  matrix:
    name: ${{ matrix.scenario }} / ${{ matrix.variant }}
    needs: [validate-registry, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate-registry.outputs.cells) }}
    steps:
      - uses: actions/checkout@v5
      - name: Download linux binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # actions/download-artifact@v8
        with:
          name: kunai-linux-binaries-matrix
          path: apps/cli/dist/bin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # docker/setup-buildx-action@v4
      - name: Build smoke image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action@v7
        with:
          context: apps/cli/test/docker/native-installer
          file: apps/cli/test/docker/native-installer/Dockerfile
          target: ${{ matrix.variant }}
          load: true
          tags: kunai-installer-smoke:${{ matrix.variant }}
      - name: Run scenario
        env:
          KUNAI_INSTALLER_DOCKER: "1"
        run: >-
          bash apps/cli/test/docker/native-installer/run-local.sh
          --skip-build
          --skip-image-build
          --only ${{ matrix.variant }}
          --scenario ${{ matrix.scenario }}
