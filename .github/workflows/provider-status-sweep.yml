name: Provider status sweep

# Daily upstream health check: resolves a known-good title through every
# registered provider from the runner's network and publishes the result to the
# `status-data` branch, which the docs site's /status page reads at render.
#
# Why a branch and not a commit to main. This job used to commit the result to
# main and rebase onto it, and the rebase was refused every day ("cannot rebase:
# You have unstaged changes"): three scheduled runs failed, nothing was pushed, and
# the board kept showing results weeks old as if they were current. The data now has
# its own branch with one writer, so it cannot conflict with a PR or be blocked by
# the state of this checkout, it needs no [skip ci] gymnastics on main, and the docs
# show it without a release because they fetch it. packages/providers/scripts/
# status-data-branch.sh does the git work and is tested against throwaway remotes.
#
# Scheduled on purpose: upstream status is a property of the providers, not of
# any PR, and the sweep needs real network time (up to ~4 min worst case).
# Runner egress is a clean-region view; region-gated providers report as
# "blocked" rather than dead.
#
# Posting a notice about a known problem needs no release and no workflow: edit
# `status-notices.json` on the `status-data` branch (the GitHub web editor is
# enough). This job seeds that file once and never overwrites it.

on:
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write # pushes the status-data branch

# One sweep at a time: a second run overlapping the first would race the
# publish, and the loser wastes a full provider-probe cycle.
concurrency:
  group: provider-status-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Probe providers and publish status
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STATUS_DIR: ${{ runner.temp }}/status-data
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: provider-status

      # The anime lane is mismeasured without this: anidb/miruro sit behind
      # Cloudflare, which 403s a bare runner handshake in <100ms, so every row
      # would read "blocked" no matter how healthy the upstream is.
      - uses: ./.github/actions/setup-curl-impersonate

      - name: Check out the status-data branch (creating it on the first run)
        run: bash packages/providers/scripts/status-data-branch.sh checkout "$STATUS_DIR"

      # Seeded once so the page has a notices file to read. Never overwritten: it is
      # the one document a maintainer edits by hand.
      - name: Seed the notices file if it is missing
        run: |
          if [ ! -f "$STATUS_DIR/status-notices.json" ]; then
            cp apps/docs/lib/status-notices.json "$STATUS_DIR/status-notices.json"
          fi

      # The sweep reads yesterday's history from $STATUS_DIR, adds today, and writes
      # both files back there.
      - name: Run the provider sweep
        working-directory: packages/providers
        env:
          KUNAI_STATUS_DIR: ${{ env.STATUS_DIR }}
        run: bun run scripts/provider-status-sweep.ts

      # generatedAt changes every run, so there is a commit a day: that is the
      # heartbeat the page's freshness line is read from. `[skip ci] [vercel skip]`
      # keeps the daily commit from queueing builds for a branch that has no app.
      - name: Publish
        run: |
          git config user.name "kunai-status-bot[bot]"
          git config user.email "kunai-status-bot[bot]@users.noreply.github.com"
          bash packages/providers/scripts/status-data-branch.sh publish "$STATUS_DIR" \
            "chore(status): sweep $(date -u +%Y-%m-%d) [skip ci] [vercel skip]"
