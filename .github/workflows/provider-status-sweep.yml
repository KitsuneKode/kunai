name: Provider status sweep

# Daily upstream health check: resolves a known-good title through every
# configured provider probe from the runner's network and commits the result
# to apps/docs/lib/generated-provider-status.json, which the docs site's
# provider-status page renders.
#
# Scheduled on purpose: upstream status is a property of the providers, not of
# any PR, and the sweep needs real network time (up to ~4 min worst case).
# Runner egress is a clean-region view; region-gated providers report as
# "blocked" rather than dead.

on:
  schedule:
    - cron: "23 6 * * *" # daily 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write # commits the refreshed status JSON

# One sweep at a time: a second run overlapping the first would race the
# status-file commit, and the loser wastes a full provider-probe cycle.
concurrency:
  group: provider-status-sweep
  cancel-in-progress: true

env:
  # Automated builds and installed-binary checks must never create analytics identities.
  DO_NOT_TRACK: "1"

jobs:
  sweep:
    name: Probe providers and publish status
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # actions/checkout@v5
      - uses: ./.github/actions/setup-bun-monorepo
        with:
          turbo-cache-prefix: provider-status

      # The official yt-dlp executable bundles its YouTube plugins and uses
      # Deno as its default JavaScript runtime.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "2.9.8"

      - name: Install yt-dlp
        run: |
          install_dir="$RUNNER_TEMP/provider-sweep-bin"
          mkdir -p "$install_dir"
          cd "$install_dir"
          curl --fail --silent --show-error --location \
            https://github.com/yt-dlp/yt-dlp/releases/download/2026.11.23/yt-dlp --output yt-dlp
          echo 'e8665ed64d6b9172773e812f891fb707a0cb1ee8d9ef4fc1acb00cabee4c5256  yt-dlp' | sha256sum --check --strict
          chmod +x yt-dlp
          ./yt-dlp --version
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run the provider sweep
        working-directory: packages/providers
        run: bun run scripts/provider-status-sweep.ts

      # The producer writes JSON, while oxfmt owns the committed representation.
      # Format before taking the publisher's snapshot so daily bot commits pass CI.
      - name: Format the observed status
        run: bun x oxfmt --write apps/docs/lib/generated-provider-status.json

      - name: Commit the status file if it changed
        run: bash .github/scripts/publish-provider-status.sh
